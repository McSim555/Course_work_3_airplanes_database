[project]
name = "course-work-3"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "requests (>=2.34.2,<3.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "types-psycopg2 (>=2.9.21.20260518,<3.0.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''.git'''

[tool.isort]
# Максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = '''.venv'''

[tool.flake8]
# Максимальная длина строки
line_length = 119
[dependency-groups]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]
